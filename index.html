<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun Quiz 💖</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Segoe UI;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    text-align:center;
    width:400px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    animation:fadeIn 0.4s ease-in-out;
}

h2{color:#444;}

button{
    padding:10px 18px;
    border:none;
    border-radius:25px;
    margin:6px;
    cursor:pointer;
    font-size:14px;
    background:#ff4b7d;
    color:white;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}

.hidden{display:none;}

.answerBox{
    text-align:left;
    margin-top:15px;
    font-size:14px;
    max-height:200px;
    overflow:auto;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>
<body>

<div class="card" id="quiz">
    <h2 id="question"></h2>
    <div id="options"></div>
</div>

<div class="card hidden" id="end">
    <h2 id="finalMessage"></h2>
    <div class="answerBox" id="answerList"></div>
</div>

<script>

let ratingGood = false;
let userAnswers = [];

let questions = [

{
q:"Meri koi sister-in-law nahi hai 😅 isliye main aapko bhej raha hoon… Will you play this quiz with me? 😊",
a:["Haha sure 😄","Chalo start karte hain","Okay let's go","Bas short hona chahiye 😎"]
},

{
q:"Do you like me as your family member?? 😊",
a:["Yes of course","Bilkul pasand ho","Haan thoda thoda","Approved 👍"]
},

{
q:"Apne hisaab se boyfriend material rating kitni dengi mujhe? 😄",
a:["10/10 😎","9/10","Potential hai 😂","Improve karo thoda 😅"]
},

{
q:"Aapka mood aaj kaisa hai? 🌸",
a:["Happy","Chill","Busy but good","Full energetic"]
},

{
q:"Family me sabse responsible kaun? 😇",
a:["Main hi hoon","Sab thode thode","Situation pe depend","Secret hai 😂"]
},

{
q:"Last question 😄 kya main pass ho gaya? 🎓",
a:["Haan pass 😎","Grace marks se","Re-test lagega 😂","Result pending"]
}

];

let current = 0;

function loadQuestion(){
    document.getElementById("question").innerText = questions[current].q;
    let optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML="";
    
    questions[current].a.forEach(opt=>{
        let btn = document.createElement("button");
        btn.innerText = opt;
        
        btn.onclick = function(){

            userAnswers.push({
                question: questions[current].q,
                answer: opt
            });

            if(current === 2){
                if(opt.includes("10") || opt.includes("9")){
                    ratingGood = true;
                }
            }

            nextQuestion();
        };

        optionsDiv.appendChild(btn);
    });
}

function nextQuestion(){
    current++;

    if(current === 3 && ratingGood){
        questions.splice(3, 0, {
            q:"Agar aapko mauka milta… to kya aap mujhe BF banati? 😜",
            a:["Confidence dekho 😂","Maybe 😄","Depends 😎","No chance mister 😜"]
        });
    }

    if(current < questions.length){
        loadQuestion();
    }else{
        showResults();
    }
}

function showResults(){
    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("end").classList.remove("hidden");

    document.getElementById("finalMessage").innerHTML =
    "You are the best didi 💖<br><br>Thank you for playing the game 😄✨<br><br>Happy Valentine's Day ❤️🌹";

    let list = "";
    userAnswers.forEach((item,index)=>{
        list += "<b>Q" + (index+1) + ":</b> " + item.answer + "<br><br>";
    });

    document.getElementById("answerList").innerHTML = list;
}

loadQuestion();

</script>

</body>
</html>
